<html>
<head>
    <title>Calculator</title>
    <link rel="stylesheet" href="./Calculator.css">
</head>
<body>

<form>
    <input class="i1" type="text" value="0" readonly><br>

    <button class="b1">AC</button>
    <button class="b2">00</button>
    <button class="b3">%</button>
    <button class="b4">+</button><br>

    <button class="b5">7</button>
    <button class="b6">8</button>
    <button class="b7">9</button>
    <button class="b8">×</button><br>

    <button class="b9">4</button>
    <button class="b10">5</button>
    <button class="b11">6</button>
    <button class="b12">−</button><br>

    <button class="b9">1</button>
    <button class="b10">2</button>
    <button class="b11">3</button>
    <button class="b15">=</button><br>

    <button class="b14">0</button>
    <button class="b9">.</button>
</form>

</body>
</html>
